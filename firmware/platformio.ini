; PlatformIO Project Configuration File for NAVIA Wearable
; Target: ESP32-C3 SuperMini (RISC-V 32-bit Architecture)

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; Serial monitor and upload settings
monitor_speed = 115200
upload_speed = 921600

; ESP32-C3 SuperMini uses internal USB CDC Serial
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3

; Libraries: Pololu VL53L0X Time-of-Flight sensor & ESP32 BLE
lib_deps = 
    pololu/VL53L0X @ ^1.3.1
