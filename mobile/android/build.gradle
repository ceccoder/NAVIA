buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def android = project.android
            if (android.hasProperty('compileSdk')) {
                android.compileSdk = 34
            }
            android.compileSdkVersion 34

            if (android.defaultConfig != null) {
                if (android.defaultConfig.hasProperty('minSdk')) {
                    android.defaultConfig.minSdk = 23
                }
                android.defaultConfig.minSdkVersion 23

                if (android.defaultConfig.hasProperty('targetSdk')) {
                    android.defaultConfig.targetSdk = 34
                }
                android.defaultConfig.targetSdkVersion 34
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
