name: navia_mobile
description: "NAVIA - Accessible Indoor Navigation App with BLE Haptics, Camera OCR, and Speech Guidance"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE communication with ESP32-C3 wearable (pinned to rock-solid stable release)
  flutter_blue_plus: 1.31.14

  # Computer Vision & OCR sign recognition
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.11.0+2

  # Voice guidance (pinned to stable version to prevent breaking changes in 4.2.x)
  flutter_tts: 3.8.5

  # Backend REST communication
  http: ^1.2.2

  # Device runtime permissions
  permission_handler: ^11.3.1

  # Launch OTA update downloads in browser
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
